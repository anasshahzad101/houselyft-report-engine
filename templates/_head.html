<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
@font-face{font-family:'Oswald';src:url('fonts/Oswald.ttf') format('truetype');font-weight:200 700;}
@font-face{font-family:'Lato';src:url('fonts/Lato-Regular.ttf') format('truetype');font-weight:400;}
@font-face{font-family:'Lato';src:url('fonts/Lato-Bold.ttf') format('truetype');font-weight:700;}
body{zoom:0.94;}
</style>
<style>
  :root{--navy:#1b2a4a;--navy2:#26365c;--green:#3f7d33;--row:#f5f6f9;--line:#e4e7ee;--ink:#2a2f3a;--mut:#7a818f;--disc:#aeb6c4;}
  *{box-sizing:border-box;}
  body{font-family:'Lato',Arial,sans-serif;color:var(--ink);font-size:9.8pt;line-height:1.55;margin:0;}
  h1,h2,h3,.os{font-family:'Oswald',Arial,sans-serif;}
  p{margin:7px 0;} ul{margin:7px 0;padding-left:18px;} li{margin:4px 0;} small{color:var(--mut);}
  .section{page-break-before:always;} .section.first{page-break-before:auto;} .section.flow{page-break-before:auto;}
  h2.sec{font-family:'Oswald';font-weight:700;color:var(--navy);font-size:19pt;letter-spacing:.3px;margin:0 0 12px;}
  h3{font-family:'Oswald';font-weight:600;color:var(--navy2);font-size:11.5pt;margin:15px 0 5px;}
  .cover{height:238mm;display:flex;flex-direction:column;align-items:center;text-align:center;page-break-after:always;}
  .wm{font-family:'Oswald';font-weight:700;font-size:20pt;letter-spacing:7px;margin-top:58mm;display:flex;align-items:center;gap:10px;}
  .wm .a{color:var(--navy);} .wm .b{color:#8b93a3;}
  .wm .emblem{width:26px;height:26px;border:3px solid var(--navy);border-radius:50%;display:inline-block;position:relative;}
  .wm .emblem:after{content:"";position:absolute;left:4px;right:4px;bottom:6px;height:7px;background:var(--navy);clip-path:polygon(0 100%,28% 30%,50% 70%,72% 10%,100% 100%);}
  .cover h1{font-family:'Oswald';font-weight:700;font-size:40pt;color:var(--navy);letter-spacing:1px;margin:50mm 0 14px;}
  .cover .addr{font-family:'Oswald';font-weight:600;font-size:19pt;color:var(--navy);}
  .cover .addr span{display:block;font-family:'Lato';font-weight:400;font-size:12pt;color:#55607a;margin-top:6px;}
  .cover .foot{margin-top:auto;font-size:7.6pt;color:var(--disc);}
  table{width:100%;border-collapse:collapse;margin:9px 0;font-size:9pt;}
  td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:nth-child(even) td{background:var(--row);}
  table.kv td:first-child{background:var(--navy);color:#fff;font-weight:600;width:34%;border-bottom:2px solid #fff;}
  table.kv tr:nth-child(even) td:first-child{background:var(--navy);}
  table.kv td:last-child{background:var(--row);}
  table.g th{background:var(--navy);color:#fff;text-align:left;padding:7px 10px;font-weight:600;font-size:8.7pt;}
  .barhead{background:var(--navy);color:#fff;font-family:'Oswald';font-weight:600;font-size:11pt;padding:8px 12px;text-align:center;}
  .imgrow{display:flex;gap:10px;margin:0 0 10px;}
  .imgbox{flex:1;height:150px;background:#eef0f4;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9aa2b2;font-size:8pt;}
  .imgbox.tall{height:148px;} .imgbox .ic{font-size:20pt;line-height:1;margin-bottom:6px;color:#c2c8d4;}
  .grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .grid4 .imgbox{height:120px;}
  .steps{display:flex;gap:12px;margin:16px 0;}
  .step{flex:1;border:1px solid var(--line);border-radius:3px;overflow:hidden;}
  .step .sh{background:var(--green);color:#fff;text-align:center;padding:10px 6px;font-family:'Oswald';}
  .step .sh .n{font-size:8pt;letter-spacing:2px;opacity:.9;display:block;}
  .step .sh .t{font-size:11pt;font-weight:700;}
  .step ul{padding:11px 10px 13px 24px;margin:0;font-size:8.3pt;} .step li{margin:5px 0;}
  .cell{border:1px solid var(--line);background:var(--row);padding:11px 13px;margin:9px 0;}
  .cell .ct{font-family:'Oswald';font-weight:600;color:var(--navy);margin-bottom:5px;font-size:10.5pt;}
  .opt{margin:13px 0;border:1px solid var(--line);}
  .opt .oh{background:var(--navy);color:#fff;font-family:'Oswald';font-weight:600;font-size:10.5pt;padding:7px 12px;}
  .opt .ob{display:flex;gap:14px;padding:12px;align-items:center;}
  .opt .massing{width:140px;flex:0 0 140px;}
  .opt .od{flex:1;font-size:8.9pt;}
  .ts{border:1px solid var(--line);margin:10px 0;}
  .ts .d{display:flex;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);} .ts .d:last-child{border-bottom:none;}
  .ts .dt{flex:0 0 150px;font-family:'Oswald';font-weight:600;color:#b5611f;font-size:9pt;} .ts .dx{flex:1;font-size:8.8pt;}
  .cta{background:var(--navy);color:#fff;padding:15px 17px;border-radius:4px;margin-top:12px;}
  .cta .fee{font-family:'Oswald';font-weight:700;font-size:16pt;}
</style>
</head>
<body>
